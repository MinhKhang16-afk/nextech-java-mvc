spring.application.name=nextech-java-mvc
server.port=8080
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nextech_shop?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:nextech}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
shop.admin.username=${APP_ADMIN_USERNAME:admin}
shop.admin.password=${APP_ADMIN_PASSWORD:ChangeMeBeforeSharing123}
shop.upload-dir=${SHOP_UPLOAD_DIR:./uploads}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
