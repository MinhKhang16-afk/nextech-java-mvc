<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Thông tin đặt hàng')}"></head><body><header th:replace="~{fragments :: header}"></header>
<section class="page-heading"><div class="container"><span class="eyebrow">NEXTECH / THANH TOÁN</span><h1>Thông tin đặt hàng</h1><p>Vui lòng điền chính xác thông tin để cửa hàng liên hệ</p></div></section>
<main class="container section"><div class="alert bad" th:if="${checkoutError}" th:text="${checkoutError}">Lỗi</div><div class="checkout-layout"><form class="panel checkout-form" th:action="@{/dat-hang}" th:object="${checkoutForm}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Thông tin người nhận</h2><div class="form-grid"><label>Họ và tên *<input class="input" th:field="*{fullName}" maxlength="120" required placeholder="Nguyễn Văn A"><small class="field-error" th:errors="*{fullName}"></small></label><label>Số điện thoại *<input class="input" th:field="*{phone}" maxlength="20" required placeholder="0901234567"><small class="field-error" th:errors="*{phone}"></small></label></div><label>Email (không bắt buộc)<input class="input" type="email" th:field="*{email}" maxlength="100" placeholder="example@gmail.com"><small class="field-error" th:errors="*{email}"></small></label><label>Địa chỉ giao hàng *<input class="input" th:field="*{address}" maxlength="255" required placeholder="Số nhà, đường, phường/xã, tỉnh/thành"><small class="field-error" th:errors="*{address}"></small></label><label>Ghi chú<textarea class="input" th:field="*{note}" rows="4" maxlength="500" placeholder="Ví dụ: giao sau 17 giờ"></textarea><small class="field-error" th:errors="*{note}"></small></label><h3>Phương thức thanh toán</h3><div class="payment-method">✓ COD — Thanh toán khi nhận hàng</div><button type="submit" class="btn btn-orange block">Xác nhận đặt hàng →</button><p class="note">Đơn hàng demo sẽ được lưu vào MySQL, không tạo giao dịch thanh toán thật.</p></form><aside class="panel order-box"><h2>Đơn hàng của bạn</h2><div class="summary-product" th:each="item : ${items}"><img th:src="${'/' + item.product().image()}" alt="Ảnh sản phẩm"><div><b th:text="${item.product().name()}">Tên</b><small th:text="${'Số lượng: ' + item.quantity()}">1</small></div><strong th:text="${#numbers.formatInteger(item.subtotal(),3,'POINT') + '₫'}">0₫</strong></div><div class="summary-line final"><span>Tổng cộng</span><strong th:text="${#numbers.formatInteger(total,3,'POINT') + '₫'}">0₫</strong></div></aside></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
