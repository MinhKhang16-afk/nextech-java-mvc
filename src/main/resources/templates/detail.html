<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><div th:replace="~{fragments :: alerts}"></div>
<div class="container breadcrumb"><a th:href="@{/}">Trang chủ</a> / <a th:href="@{/san-pham}">Sản phẩm</a> / <span th:text="${product.name()}">Chi tiết</span></div>
<main class="container detail-layout"><div class="detail-photo"><img th:src="${'/' + product.image()}" th:alt="${product.name()}"></div><div class="detail-info"><span class="eyebrow" th:text="${product.categoryName()}">Danh mục</span><h1 th:text="${product.name()}">Sản phẩm</h1><p class="muted" th:text="${'Mã sản phẩm: ' + product.sku()}">Mã</p><p class="detail-description" th:text="${product.description()}">Mô tả</p><strong class="detail-price" th:text="${#numbers.formatInteger(product.price(),3,'POINT') + '₫'}">0₫</strong><p th:class="${product.stock() > 0 ? 'stock-ok' : 'stock-no'}" th:text="${product.stock() > 0 ? '✓ Còn ' + product.stock() + ' sản phẩm' : 'Hết hàng'}"></p><form th:action="@{/gio-hang/them}" method="post" class="buy-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${product.id()}"><label>Số lượng<input type="number" name="quantity" class="input" min="1" th:max="${product.stock()}" value="1"></label><button class="btn btn-orange" type="submit" th:disabled="${product.stock() == 0}">🛒 Thêm vào giỏ hàng</button></form><div class="info-panel"><h3>Thông số sản phẩm</h3><p class="spec-text" th:text="${product.specifications()}">Thông số</p></div></div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
