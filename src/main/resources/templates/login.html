<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng nhập quản trị')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container section"><div class="login-box"><h1>Đăng nhập quản trị</h1><p class="muted">Đăng nhập để tiếp nhận đơn hàng và quản lý sản phẩm</p><div class="alert bad" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng</div><div class="alert good" th:if="${param.logout}">Đã đăng xuất</div><form th:action="@{/dang-nhap}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Tên đăng nhập<input class="input" type="text" name="username" autocomplete="username" required></label><label>Mật khẩu<input class="input" type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-orange block">Đăng nhập</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
