<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản lý đơn hàng')}"></head><body><header th:replace="~{fragments :: header}"></header><div th:replace="~{fragments :: alerts}"></div><main class="container section"><h1 class="admin-title">Trung tâm quản trị</h1><div th:replace="~{admin/nav :: adminnav}"></div><div class="stats"><div><span>Tổng đơn hàng</span><strong th:text="${orderCount}">0</strong></div><div><span>Doanh thu hoàn tất (demo)</span><strong th:text="${#numbers.formatInteger(revenue,3,'POINT') + '₫'}">0₫</strong></div></div><div class="panel"><h2>Danh sách đơn hàng</h2><div class="tablewrap"><table><thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Điện thoại</th><th>Tổng tiền</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody><tr th:each="o : ${orders}"><td th:text="${o.code()}">DH</td><td th:text="${o.customerName()}">Tên</td><td th:text="${o.phone()}">SĐT</td><td th:text="${#numbers.formatInteger(o.total(),3,'POINT') + '₫'}">0₫</td><td><span class="badge" th:text="${o.status()}">Trạng thái</span></td><td><a class="link" th:href="@{/quan-tri/don-hang/{id}(id=${o.id()})}">Xem →</a></td></tr><tr th:if="${orders.isEmpty()}"><td colspan="6">Chưa có đơn hàng.</td></tr></tbody></table></div></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
