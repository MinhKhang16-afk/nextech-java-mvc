<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quản trị sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><div th:replace="~{fragments :: alerts}"></div><main class="container section"><h1 class="admin-title">Quản lý sản phẩm</h1><div th:replace="~{admin/nav :: adminnav}"></div><div class="admin-actions"><h2>Danh sách sản phẩm</h2><a class="btn btn-orange" th:href="@{/quan-tri/san-pham/them}">+ Thêm sản phẩm</a></div><div class="panel tablewrap"><table><thead><tr><th>Hình</th><th>Mã</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th>Hiển thị</th><th></th></tr></thead><tbody><tr th:each="p : ${products}"><td><img class="table-img" th:src="${'/' + p.image()}" alt="Ảnh"></td><td th:text="${p.sku()}">SP</td><td th:text="${p.name()}">Tên</td><td th:text="${p.categoryName()}">Danh mục</td><td th:text="${#numbers.formatInteger(p.price(),3,'POINT') + '₫'}">0₫</td><td th:text="${p.stock()}">0</td><td th:text="${p.active() ? 'Có' : 'Ẩn'}">Có</td><td><a class="link" th:href="@{/quan-tri/san-pham/{id}/sua(id=${p.id()})}">Chỉnh sửa</a></td></tr></tbody></table></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
