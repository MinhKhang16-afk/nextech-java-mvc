<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chỉnh sửa khách hàng')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container section">
  <h1 class="admin-title">Chỉnh sửa thông tin khách hàng</h1>
  <div th:replace="~{admin/nav :: adminnav}"></div>
  <div class="panel edit-form">
    <div class="alert bad" th:if="${error}" th:text="${error}">Có lỗi</div>
    <dl class="details">
      <dt>Mã tài khoản</dt><dd th:text="${customer.id()}">1</dd>
      <dt>Email đăng nhập</dt><dd th:text="${customer.email()}">customer@example.com</dd>
      <dt>Ngày đăng ký</dt><dd th:text="${#temporals.format(customer.createdAt(),'dd/MM/yyyy HH:mm')}">01/01/2026</dd>
    </dl>
    <p class="note">Email đăng nhập được giữ nguyên để tránh ảnh hưởng đến tài khoản. Mật khẩu không được xem hoặc thay đổi tại màn hình này.</p>
    <form method="post" th:action="@{/quan-tri/tai-khoan/{id}/sua(id=${customer.id()})}" th:object="${customerForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Họ và tên *
        <input class="input" th:field="*{fullName}" maxlength="120" required>
      </label>
      <label>Số điện thoại
        <input class="input" th:field="*{phone}" type="tel" maxlength="20" placeholder="0901234567">
      </label>
      <label>Ngày sinh
        <input class="input" th:field="*{birthDate}" type="date">
      </label>
      <button class="btn btn-orange" type="submit">Lưu thông tin</button>
      <a class="btn btn-outline" th:href="@{/quan-tri/tai-khoan}">Quay lại</a>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
