<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chỉnh sửa sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><main class="container section"><h1 class="admin-title" th:text="${editId == null ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'}">Sản phẩm</h1><div th:replace="~{admin/nav :: adminnav}"></div><div class="alert bad" th:if="${error}" th:text="${error}">Lỗi</div><form class="panel edit-form" method="post" enctype="multipart/form-data" th:action="@{/quan-tri/san-pham/luu}" th:object="${productForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:if="${editId != null}" th:value="${editId}"><div class="form-grid"><label>Mã sản phẩm *<input class="input" th:field="*{sku}" maxlength="30" required placeholder="DT005"></label><label>Tên sản phẩm *<input class="input" th:field="*{name}" maxlength="150" required placeholder="Tên thiết bị"></label></div><div class="form-grid"><label>Danh mục *<select class="input" th:field="*{categoryId}" required><option value="0">Chọn danh mục</option><option th:each="c : ${categories}" th:value="${c.id()}" th:text="${c.name()}">Danh mục</option></select></label><label>Giá bán (VNĐ) *<input class="input" type="number" min="0" max="999999999999" th:field="*{price}" required></label></div><label>Số lượng tồn *<input class="input" type="number" min="0" max="1000000" th:field="*{stock}" required></label><label>Mô tả<textarea class="input" rows="3" th:field="*{description}"></textarea></label><label>Thông số kỹ thuật<textarea class="input" rows="5" th:field="*{specifications}"></textarea></label><label>Hình ảnh JPEG/PNG (tối đa 4MB)<input class="input" name="file" type="file" accept="image/png,image/jpeg"></label><img th:if="${currentImage != null}" th:src="${'/' + currentImage}" alt="Ảnh hiện tại" class="preview-img"><div class="checkboxes"><label><input type="checkbox" th:field="*{featured}"> Sản phẩm nổi bật</label><label><input type="checkbox" th:field="*{active}"> Hiển thị trên cửa hàng</label></div><button class="btn btn-orange">Lưu sản phẩm</button><a class="btn btn-outline" th:href="@{/quan-tri/san-pham}">Hủy</a></form></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
