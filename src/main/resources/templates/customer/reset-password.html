<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đặt lại mật khẩu')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container section">
  <div class="login-box customer-auth-box">
    <span class="eyebrow">NEXTECH MEMBER</span>
    <h1>Đặt lại mật khẩu</h1>
    <form method="post" th:action="@{/tai-khoan/dat-lai-mat-khau}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="token" th:value="${token}">
      <label>Mật khẩu mới
        <input class="input" type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password">
      </label>
      <label>Nhập lại mật khẩu
        <input class="input" type="password" name="confirmPassword" minlength="8" maxlength="72" required autocomplete="new-password">
      </label>
      <button class="btn btn-orange block" type="submit" th:disabled="${#strings.isEmpty(token)}">Cập nhật mật khẩu</button>
    </form>
    <p class="auth-switch"><a class="link" th:href="@{/tai-khoan/dang-nhap}">Quay lại đăng nhập</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
