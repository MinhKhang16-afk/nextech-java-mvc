<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quên mật khẩu')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container section">
  <div class="login-box customer-auth-box">
    <span class="eyebrow">NEXTECH MEMBER</span>
    <h1>Quên mật khẩu</h1>
    <p class="muted">Nhập email đăng ký. Nếu tài khoản tồn tại và đang hoạt động, hệ thống sẽ gửi liên kết đặt lại mật khẩu.</p>
    <div class="alert bad" th:if="${!mailEnabled}">Chức năng cần cấu hình SMTP trong file .env trước khi sử dụng.</div>
    <div class="alert good" th:if="${param.sent}">Nếu email hợp lệ, hướng dẫn đã được gửi. Hãy kiểm tra cả thư mục Spam.</div>
    <form method="post" th:action="@{/tai-khoan/quen-mat-khau}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Email đăng ký
        <input class="input" type="email" name="email" maxlength="190" required autocomplete="email">
      </label>
      <button class="btn btn-orange block" type="submit" th:disabled="${!mailEnabled}">Gửi liên kết đặt lại</button>
    </form>
    <p class="auth-switch"><a class="link" th:href="@{/tai-khoan/dang-nhap}">Quay lại đăng nhập</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
