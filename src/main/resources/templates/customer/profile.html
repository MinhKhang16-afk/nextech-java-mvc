<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tài khoản của tôi')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: alerts}"></div>
<main class="container section">
  <div class="login-box customer-auth-box">
    <span class="eyebrow">NEXTECH MEMBER</span>
    <h1>Tài khoản của tôi</h1>
    <div class="avatar-editor">
      <img th:if="${avatarPath != null and !#strings.isEmpty(avatarPath)}"
           class="profile-avatar" th:src="${'/' + avatarPath}" alt="Ảnh đại diện">
      <span th:unless="${avatarPath != null and !#strings.isEmpty(avatarPath)}"
            class="profile-avatar profile-avatar-fallback" th:text="${customerInitials}">KH</span>
      <form th:action="@{/tai-khoan/avatar}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Ảnh đại diện (JPEG/PNG, tối đa 4 MB)
          <input class="input" type="file" name="file" accept="image/jpeg,image/png" required>
        </label>
        <button class="btn btn-outline" type="submit">Cập nhật avatar</button>
      </form>
    </div>
    <dl class="account-detail">
      <dt>Họ và tên</dt><dd th:text="${fullName}">Khách hàng</dd>
      <dt>Email</dt><dd th:text="${email}">email@example.com</dd>
      <dt>Số điện thoại</dt><dd th:text="${#strings.isEmpty(phone) ? 'Chưa cập nhật' : phone}">0901234567</dd>
      <dt>Ngày sinh</dt><dd th:text="${birthDate == null ? 'Chưa cập nhật' : #temporals.format(birthDate, 'dd/MM/yyyy')}">Chưa cập nhật</dd>
      <dt>Ngày đăng ký</dt><dd th:text="${#temporals.format(createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</dd>
    </dl>
    <a class="btn btn-orange block" th:href="@{/tai-khoan/don-hang}">
      Lịch sử mua hàng (<span th:text="${orderCount}">0</span>)
    </a>
    <a class="btn btn-outline block" th:href="@{/san-pham}">Tiếp tục mua sắm</a>
    <form th:action="@{/dang-xuat}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="btn btn-outline block" type="submit">Đăng xuất</button>
    </form>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
