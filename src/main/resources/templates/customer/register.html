<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đăng ký tài khoản')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container section">
  <div class="login-box customer-auth-box">
    <span class="eyebrow">NEXTECH MEMBER</span>
    <h1>Tạo tài khoản</h1>
    <p class="muted">Đăng ký để có tài khoản mua sắm trên NexTech.</p>
    <form th:action="@{/tai-khoan/dang-ky}" th:object="${registrationForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Họ và tên *<input class="input" th:field="*{fullName}" maxlength="120" autocomplete="name" required placeholder="Nguyễn Văn A">
        <small class="field-error" th:errors="*{fullName}"></small></label>
      <label>Email đăng nhập *<input class="input" type="email" th:field="*{email}" maxlength="190" autocomplete="email" required placeholder="ban@example.com">
        <small class="field-error" th:errors="*{email}"></small></label>
      <label>Số điện thoại (tùy chọn)<input class="input" type="tel" th:field="*{phone}" maxlength="20" autocomplete="tel" placeholder="0901234567">
        <small class="field-error" th:errors="*{phone}"></small></label>
      <label>Mật khẩu *<input class="input" type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <small class="field-error" th:errors="*{password}"></small></label>
      <label>Xác nhận mật khẩu *<input class="input" type="password" name="confirmPassword" autocomplete="new-password" required>
        <small class="field-error" th:errors="*{confirmPassword}"></small></label>
      <button class="btn btn-orange block" type="submit">Đăng ký tài khoản</button>
    </form>
    <p class="auth-switch">Đã có tài khoản? <a class="link" th:href="@{/tai-khoan/dang-nhap}">Đăng nhập</a></p>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body></html>
