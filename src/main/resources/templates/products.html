<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Danh mục sản phẩm')}"></head><body><header th:replace="~{fragments :: header}"></header><div th:replace="~{fragments :: alerts}"></div>
<section class="page-heading"><div class="container"><span class="eyebrow">NEXTECH / SẢN PHẨM</span><h1>Khám phá sản phẩm</h1><p>Chọn đúng thiết bị phù hợp với bạn</p></div></section>
<main class="container catalog-layout"><aside class="sidebar"><h3>Danh mục</h3><a th:href="@{/san-pham}" th:classappend="${selectedCategory == null ? 'selected' : ''}">Tất cả sản phẩm</a><a th:each="c : ${categories}" th:href="@{/san-pham(danh_muc=${c.id()})}" th:classappend="${selectedCategory != null and selectedCategory == c.id() ? 'selected' : ''}" th:text="${c.name()}">Danh mục</a><div class="sidebar-help">💡 <b>Mẹo nhỏ</b><p>Lọc sản phẩm theo danh mục hoặc tìm kiếm tên sản phẩm.</p></div></aside>
<div><form class="toolbar" method="get" th:action="@{/san-pham}"><input type="hidden" name="danh_muc" th:if="${selectedCategory != null}" th:value="${selectedCategory}"><input class="input" type="search" name="q" th:value="${query}" placeholder="🔎 Tìm điện thoại, laptop, dây sạc..."><select class="input" name="sap_xep"><option value="">Sản phẩm nổi bật</option><option value="gia-tang" th:selected="${sort == 'gia-tang'}">Giá tăng dần</option><option value="gia-giam" th:selected="${sort == 'gia-giam'}">Giá giảm dần</option><option value="ten" th:selected="${sort == 'ten'}">Theo tên A–Z</option></select><button class="btn btn-dark">Tìm kiếm</button></form><p class="results" th:text="${products.size() + ' sản phẩm được tìm thấy'}">0 sản phẩm</p><div class="product-grid catalog-grid"><div th:each="p : ${products}" th:replace="~{fragments :: card(${p})}"></div></div><div class="empty" th:if="${products.isEmpty()}"><h2>Không tìm thấy sản phẩm</h2><a th:href="@{/san-pham}">Xóa bộ lọc →</a></div></div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
