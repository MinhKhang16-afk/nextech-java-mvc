
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextech_shop
      MYSQL_USER: nextech
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/nextech_shop.sql:/docker-entrypoint-initdb.d/01-nextech-shop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
    # web uses network_mode: "service:db", so DNS must be configured here.
    # Codespaces host uses Azure-provided DNS; Docker containers must use the same resolver.
    dns:
      - 168.63.129.16
    networks:
      - appnet

  web:
    build: .
    restart: unless-stopped
    network_mode: "service:db"
    environment:
      DB_URL: "jdbc:mysql://127.0.0.1:3306/nextech_shop?useUnicode=true&characterEncoding=UTF-8"
      DB_USER: nextech
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      SHOP_UPLOAD_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@nextech.local}
      PAYMENT_BANK_CODE: ${PAYMENT_BANK_CODE}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT}
      PAYMENT_BANK_ACCOUNT_NAME: ${PAYMENT_BANK_ACCOUNT_NAME}
    volumes:
      - upload_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  upload_data:

networks:
  appnet:
    driver: bridge
